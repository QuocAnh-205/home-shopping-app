groups:
  # ==========================================================
  # Hạ tầng EC2
  # ==========================================================
  - name: host
    rules:
      - alert: HostHighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU EC2 cao: {{ $value | printf \"%.1f\" }}%"
          description: "CPU của {{ $labels.instance }} vượt 85% liên tục 5 phút. Kiểm tra container tốn CPU trên dashboard cAdvisor."

      - alert: HostDiskSpaceLow
        expr: |
          (node_filesystem_avail_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{mountpoint="/", fstype!~"tmpfs|overlay|squashfs"}) * 100 < 15
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Ổ đĩa EC2 sắp đầy: chỉ còn {{ $value | printf \"%.1f\" }}% trống"
          description: "Chạy 'docker system df' và 'docker image prune -af'; kiểm tra /opt/homeshop/backups."

      - alert: HostMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM EC2 sử dụng {{ $value | printf \"%.1f\" }}%"
          description: "RAM > 90% trong 10 phút, hệ thống đang dùng swap nhiều."

      - alert: DatabaseBackupMissing
        expr: time() - homeshop_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Không có bản backup DB thành công trong 26 giờ qua"
          description: "Kiểm tra /var/log/homeshop-backup.log và cronjob /etc/cron.d/homeshop-backup."

  # ==========================================================
  # Container
  # ==========================================================
  - name: containers
    rules:
      - alert: BackendContainerRestarting
        expr: changes(container_start_time_seconds{container_label_com_docker_compose_service="backend"}[15m]) > 2
        labels:
          severity: critical
        annotations:
          summary: "Container backend restart liên tục ({{ $value }} lần/15 phút)"
          description: "Có thể crash-loop (OOM, mất kết nối DB). Xem log: {service=\"backend\"} trong Loki."

      - alert: BackendDown
        expr: sum(up{job="backend"}) == 0 or absent(up{job="backend"})
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Không còn instance backend nào trả metrics"
          description: "API /api/* đang không phục vụ được. Kiểm tra 'docker compose ps' trên EC2."

      - alert: ContainerOomKilled
        expr: increase(container_oom_events_total{container_label_com_docker_compose_project="homeshop"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} bị OOM kill"
          description: "Xem xét tăng memory limit trong docker-compose.prod.yml."

  # ==========================================================
  # Ứng dụng (RED metrics)
  # ==========================================================
  - name: application
    rules:
      - alert: BackendHigh5xxRate
        expr: |
          (
            sum(rate(http_requests_total{job="backend", status=~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job="backend"}[5m]))
          ) > 0.05
          and sum(rate(http_requests_total{job="backend"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tỷ lệ lỗi HTTP 5xx = {{ $value | humanizePercentage }}"
          description: "Hơn 5% request backend lỗi 5xx trong 5 phút. Truy vết: {service=\"backend\"} | json | level=\"error\"."

      - alert: BackendHighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="backend"}[5m]))) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latency p95 backend = {{ $value | printf \"%.2f\" }}s"
          description: "p95 > 1s trong 10 phút."

      # ---------- Business / security signals ----------
      - alert: LoginBruteForceSuspected
        expr: sum(increase(shop_auth_events_total{event="login_failed"}[5m])) > 30
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} lần đăng nhập sai trong 5 phút"
          description: "Nghi brute-force/credential stuffing. Xem IP trong Loki: {service=\"nginx\"} |= \"/api/auth/login\" | json | status=\"401\"."

      - alert: AccountLockoutsSpike
        expr: sum(increase(shop_auth_events_total{event="locked"}[15m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} lượt bị khóa tài khoản trong 15 phút"
          description: "Nhiều tài khoản đang bị dò mật khẩu cùng lúc."

      - alert: OrderFailureRateHigh
        expr: |
          sum(increase(shop_orders_total{result="failed"}[15m]))
            / clamp_min(sum(increase(shop_orders_total[15m])), 1) > 0.3
          and sum(increase(shop_orders_total[15m])) >= 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Tỷ lệ đặt hàng thất bại {{ $value | humanizePercentage }}"
          description: "Hơn 30% đơn thất bại (hết hàng hàng loạt hoặc lỗi DB). Loki: {service=\"backend\", event=\"order.failed\"}."

      - alert: OrderFailuresSpike
        expr: increase(shop_orders_total{result="failed"}[10m]) > 10
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} đơn hàng thất bại trong 10 phút"
          description: "Truy vết: {service=\"backend\"} | json | event=\"order.failed\"."

  # ==========================================================
  # Data tier & Monitoring
  # ==========================================================
  - name: datastores
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL không phản hồi"
          description: "postgres-exporter không kết nối được database."

      - alert: PostgresTooManyConnections
        expr: sum(pg_stat_activity_count) / max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL dùng > 80% max_connections"
          description: "Kiểm tra connection pool của Prisma (connection_limit)."

      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis không phản hồi"
          description: "Giỏ hàng & cache đang không hoạt động."

      - alert: ScrapeTargetDown
        expr: up{job!="backend"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} ({{ $labels.instance }}) không scrape được"
          description: "Exporter có thể đã dừng."
