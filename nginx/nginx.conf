# ============================================================
# Home Shopping App - Nginx Reverse Proxy (production)
# TLS Let's Encrypt · HTTP→HTTPS · Rate limiting · Gzip · Static cache
# ============================================================
user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;
pid   /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- Cơ bản & hiệu năng ----------
    server_tokens        off;
    sendfile             on;
    tcp_nopush           on;
    tcp_nodelay          on;
    keepalive_timeout    65s;
    keepalive_requests   1000;
    types_hash_max_size  2048;

    # Chống Slowloris / body quá lớn (ảnh sản phẩm tối đa 5 MB)
    client_max_body_size     6m;
    client_body_buffer_size  128k;
    client_header_timeout    15s;
    client_body_timeout      15s;
    send_timeout             30s;
    reset_timedout_connection on;

    # Docker embedded DNS: re-resolve IP container khi deploy rolling (backend/frontend scale 2 → 1)
    resolver          127.0.0.11 valid=5s ipv6=off;
    resolver_timeout  3s;

    # ---------- Logging dạng JSON (Promtail/Loki parse trực tiếp) ----------
    log_format json_combined escape=json
      '{'
        '"time":"$time_iso8601",'
        '"request_id":"$request_id",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time",'
        '"cache_status":"$upstream_cache_status",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"ssl_protocol":"$ssl_protocol"'
      '}';
    access_log  /var/log/nginx/access.log  json_combined;

    # ---------- Gzip ----------
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_min_length    1024;
    gzip_buffers       16 8k;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml application/rss+xml
        application/manifest+json image/svg+xml font/ttf font/otf;

    # ---------- Rate limiting (chống DDoS L7 cơ bản & spam đặt hàng) ----------
    # Chỉ áp key cho POST /api/orders; GET (xem lịch sử đơn) có key rỗng → không bị tính
    map $request_method $order_limit_key {
        POST     $binary_remote_addr;
        default  "";
    }
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=api:10m      rate=15r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m     rate=10r/m;
    limit_req_zone  $order_limit_key     zone=orders:10m   rate=6r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;
    limit_req_status   429;
    limit_conn_status  429;
    limit_req_log_level warn;

    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }

    # ---------- Cache cho static assets của Next.js ----------
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static_cache:20m
                     max_size=512m inactive=7d use_temp_path=off;

    # ---------- Upstreams (zone + resolve: Nginx ≥ 1.27.3 OSS) ----------
    upstream frontend_upstream {
        zone   frontend_upstream 64k;
        server frontend:3000 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream backend_upstream {
        zone   backend_upstream 64k;
        server backend:8080 resolve max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ============ HTTP :80 → chỉ phục vụ ACME challenge, còn lại redirect HTTPS ============
    server {
        listen       80 default_server;
        server_name  _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
            try_files $uri =404;
        }

        # Healthcheck nội bộ cho Docker
        location = /nginx-health {
            access_log off;
            allow 127.0.0.1;
            deny  all;
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============ HTTPS :443 ============
    server {
        listen       443 ssl default_server;
        http2        on;
        server_name  _;

        # Cert được certbot cấp với --cert-name homeshop (không hardcode domain trong config)
        ssl_certificate      /etc/letsencrypt/live/homeshop/fullchain.pem;
        ssl_certificate_key  /etc/letsencrypt/live/homeshop/privkey.pem;

        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers  off;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_timeout        1d;
        ssl_session_tickets        off;
        # Không bật OCSP stapling: Let's Encrypt đã ngừng dịch vụ OCSP từ 2025

        limit_conn perip 50;

        include /etc/nginx/snippets/security-headers.conf;

        # Không bao giờ lộ metrics Prometheus ra Internet
        location = /api/metrics {
            return 404;
        }

        # Health API: không rate-limit để script deploy & uptime monitor luôn gọi được
        location = /api/health {
            access_log off;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }

        # Chống spam đặt hàng: 6 đơn/phút/IP, cho burst 3, vượt → 429
        location = /api/orders {
            limit_req zone=orders burst=3 nodelay;
            limit_req zone=api burst=30 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }

        # Chống brute-force đăng nhập / đăng ký
        location ^~ /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }

        location ^~ /api/ {
            limit_req zone=api burst=30 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }

        # Static build của Next.js có hash trong tên file → cache 1 năm, immutable
        location ^~ /_next/static/ {
            proxy_cache            static_cache;
            proxy_cache_valid      200 301 302 365d;
            proxy_cache_valid      404 1m;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock       on;
            include /etc/nginx/snippets/proxy-params.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status always;
            access_log off;
            proxy_pass http://frontend_upstream;
        }

        # File tĩnh trong /public (favicon, robots, ảnh banner) → cache 7 ngày
        location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|txt)$ {
            proxy_cache            static_cache;
            proxy_cache_valid      200 7d;
            proxy_cache_use_stale  error timeout updating http_500 http_502 http_503 http_504;
            include /etc/nginx/snippets/proxy-params.conf;
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            add_header X-Cache-Status $upstream_cache_status always;
            access_log off;
            proxy_pass http://frontend_upstream;
        }

        # SSR pages của Next.js
        location / {
            limit_req zone=general burst=60 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://frontend_upstream;
        }

        # Trang lỗi thân thiện khi upstream đang khởi động lại
        error_page 502 503 504 /50x.json;
        location = /50x.json {
            internal;
            default_type application/json;
            return 503 '{"statusCode":503,"message":"Service temporarily unavailable, please retry"}';
        }
    }
}
