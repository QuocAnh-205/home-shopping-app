# Dùng chung cho mọi location proxy (proxy_set_header ở location sẽ ghi đè cấp cha nên gom vào snippet)
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# Nginx là edge: ghi đè XFF bằng IP thật, không tin header client gửi lên (chống IP spoofing qua rate-limit backend)
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-Id      $request_id;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

proxy_connect_timeout  5s;
proxy_send_timeout     30s;
proxy_read_timeout     30s;
proxy_buffering        on;
proxy_buffers          16 16k;
proxy_buffer_size      16k;

# Rolling deploy: container cũ vừa dừng → tự retry sang container mới (chỉ với request idempotent)
proxy_next_upstream          error timeout http_502 http_503;
proxy_next_upstream_tries    3;
proxy_next_upstream_timeout  10s;
