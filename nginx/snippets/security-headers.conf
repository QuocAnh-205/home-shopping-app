# add_header trong location ghi đè cấp server → include lại snippet này ở location có add_header riêng
# Nguồn DUY NHẤT của header bảo mật (header trùng tên từ Next.js bị ẩn trong proxy-params.conf)
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self), payment=(), usb=()" always;
# same-origin-allow-popups: cô lập cửa sổ (chống tab-nabbing) nhưng vẫn cho popup đăng nhập Google / Facebook hoạt động
add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
# CSP: chỉ tài nguyên của chính site + đúng các dịch vụ cần dùng
#  - accounts.google.com/gsi: Google One Tap (đăng nhập 1 chạm bằng tài khoản Google đang đăng nhập trên trình duyệt)
#  - blob: ảnh xem trước khi cắt ảnh đại diện (tạo ngay trên trình duyệt)
add_header Content-Security-Policy   "default-src 'self'; img-src 'self' data: blob: https://*.amazonaws.com https://*.googleusercontent.com https://*.fbsbx.com https://img.vietqr.io https://*.tile.openstreetmap.fr https://tile.openstreetmap.de; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; connect-src 'self' https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com https://www.facebook.com" always;
add_header X-Request-Id              $request_id always;
