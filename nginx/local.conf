# Cấu hình Nginx cho môi trường demo local (HTTP, không TLS) - dùng với docker-compose.local.yml
user  nginx;
worker_processes  auto;
pid   /var/run/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;
    client_max_body_size 6m;
    resolver 127.0.0.11 valid=5s ipv6=off;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    map $request_method $order_limit_key {
        POST     $binary_remote_addr;
        default  "";
    }
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ''       '';
    }
    limit_req_zone $binary_remote_addr zone=api:10m    rate=15r/s;
    limit_req_zone $order_limit_key    zone=orders:10m rate=6r/m;
    limit_req_status 429;

    upstream frontend_upstream {
        zone frontend_upstream 64k;
        server frontend:3000 resolve;
        keepalive 16;
    }
    upstream backend_upstream {
        zone backend_upstream 64k;
        server backend:8080 resolve;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;

        # Cùng bộ header/CSP với production → lỗi CSP lộ ra ngay khi chạy local, không đợi lên AWS
        include /etc/nginx/snippets/security-headers.conf;

        location = /nginx-health { access_log off; return 200 "ok\n"; }
        location = /api/metrics  { return 404; }

        location = /api/orders {
            limit_req zone=orders burst=3 nodelay;
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }
        location ^~ /api/ {
            limit_req zone=api burst=30 nodelay;
            # Yêu cầu trả hàng kèm tối đa 5 ảnh × 2 MB: chỉ endpoint này được gửi body tới 11 MB
            location ~ "^/api/orders/[0-9a-f-]{36}/return$" {
                client_max_body_size 11m;
                include /etc/nginx/snippets/proxy-params.conf;
                proxy_pass http://backend_upstream;
            }
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://backend_upstream;
        }
        location / {
            include /etc/nginx/snippets/proxy-params.conf;
            proxy_pass http://frontend_upstream;
        }
    }
}
