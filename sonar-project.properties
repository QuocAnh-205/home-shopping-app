# organization & projectKey được truyền từ GitHub Variables (SONAR_ORGANIZATION, SONAR_PROJECT_KEY)
sonar.projectName=Home Shopping App
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

sonar.sources=backend/src,frontend/src
sonar.tests=backend/src
sonar.test.inclusions=**/*.spec.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.spec.ts
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/*.dto.ts,frontend/**

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
sonar.typescript.tsconfigPaths=backend/tsconfig.json,frontend/tsconfig.json

# Quét thêm IaC & Docker (Sonar hỗ trợ Terraform, Dockerfile)
sonar.terraform.provider.aws.version=5
