title = "Home Shopping App - Gitleaks config"

[extend]
# Kế thừa toàn bộ rule mặc định (AWS key, GitHub token, private key, JWT, Discord webhook...)
useDefault = true

[[rules]]
id = "discord-webhook-url"
description = "Discord webhook URL"
regex = '''https://(?:discord|discordapp)\.com/api/webhooks/[0-9]{17,20}/[A-Za-z0-9_\-]{60,70}'''
keywords = ["discord.com/api/webhooks", "discordapp.com/api/webhooks"]

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '''\b[0-9]{8,10}:AA[0-9A-Za-z_\-]{33}\b'''
keywords = [":AA"]

[allowlist]
description = "File mẫu & môi trường demo local chứa giá trị giả, không phải secret thật"
paths = [
  '''\.env\.example$''',
  '''terraform/terraform\.tfvars\.example$''',
  '''docker-compose\.local\.yml$''',
  '''(^|/)package-lock\.json$''',
]
